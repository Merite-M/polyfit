<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PolyFit 3D Isometric Hexagonal 'P' Logo Mark -->
  <g id="logo-mark">
    <!-- Top Horizontal Hex/Isometric Plane (Vibrant Emerald) -->
    <path d="M70 30 L130 30 L160 81.96 L130 133.92 L70 133.92 L40 81.96 Z" fill="#28D17C" />

    <!-- Outer Right & Bottom Facets of P Loop (Medium Emerald) -->
    <path d="M130 30 L160 81.96 L130 133.92 L100 133.92 L130 81.96 L100 30 Z" fill="#10B981" />

    <!-- Left Vertical Stem (Deep Tech Navy) -->
    <path d="M40 81.96 L70 133.92 L70 210 L40 158.04 Z" fill="#0B1F33" />

    <!-- Outer Left Plane (Dark Navy Accent) -->
    <path d="M40 81.96 L70 30 L70 133.92 L40 81.96 Z" fill="#06121E" />

    <!-- Center Counter: Open Cutout Shape (Using Path Masking / Composite) -->
    <polygon points="85,62.5 115,62.5 130,88.48 115,114.46 85,114.46 70,88.48" fill="#0B1F33" />
  </g>

  <!-- Wordmark 'PolyFit' -->
  <g id="wordmark">
    <text x="200" y="145" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#0B1F33">
      Poly<tspan fill="#28D17C">Fit</tspan>
    </text>
  </g>
</svg>
